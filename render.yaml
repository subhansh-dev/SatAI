# Render.com blueprint — SatAI (SatQuery AI, PS SIH26167)
# Cloud mode uses OpenRouter; the local vLLM path is for air-gapped finals.
services:
  - type: web
    name: satai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: VLM_MODE
        value: "cloud"
      - key: CLOUD_MODEL
        value: "qwen/qwen-2.5-vl-72b-instruct"
      - key: OPENROUTER_API_KEY
        sync: false          # set in the Render dashboard — never commit
      - key: SATAI_PORT
        value: "8500"
      # Ping our own /api/health every 10 min so the free instance never
      # sleeps in front of a judge (503 on first request = cold boot).
      - key: SATAI_KEEPALIVE
        value: "1"

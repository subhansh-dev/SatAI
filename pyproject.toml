[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satai"
version = "2.0.0"
description = "SatQuery AI - Agentic Vision-Language Assistant for Multimodal Remote Sensing Image Analysis (SIH26167, ISRO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team SatAI" }]
keywords = [
    "remote-sensing", "satellite", "vision-language-model",
    "agentic-ai", "isro", "sih26167", "geospatial", "sar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "tifffile>=2024.1.30",
]

[project.optional-dependencies]
training = [
    "torch>=2.2",
    "transformers>=4.49",
    "peft>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "qwen-vl-utils>=0.0.8",
]
geo = ["rasterio>=1.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
satai = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/subhansh-dev/SatAI"
Documentation = "https://github.com/subhansh-dev/SatAI#readme"
Repository = "https://github.com/subhansh-dev/SatAI"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
